<svg viewBox="0 0 860 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Addis Ride architecture diagram">
  <defs>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>

    <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#64748B" />
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#D97706" />
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#0D9488" />
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="860" height="470" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />

  <!-- Column Tier Headers -->
  <text x="90" y="34" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.08em" text-anchor="middle">CLIENTS</text>
  <text x="275" y="34" fill="#B45309" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.08em" text-anchor="middle">EDGE</text>
  <text x="485" y="34" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.08em" text-anchor="middle">CORE SERVICES & STATE</text>
  <text x="725" y="34" fill="#0F766E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.08em" text-anchor="middle">ASYNC & TELEMETRY</text>

  <!-- Subtle vertical lane dividers -->
  <line x1="180" y1="48" x2="180" y2="405" stroke="#F1F5F9" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="370" y1="48" x2="370" y2="405" stroke="#F1F5F9" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="600" y1="48" x2="600" y2="405" stroke="#F1F5F9" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- ================= CLIENTS ================= -->
  <g filter="url(#card-shadow)">
    <rect x="25" y="105" width="130" height="54" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="90" y="129" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle">rider-app</text>
    <text x="90" y="146" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" text-anchor="middle">REST · WebSocket</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="25" y="255" width="130" height="54" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="90" y="279" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle">driver-app</text>
    <text x="90" y="296" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" text-anchor="middle">Telemetry · WS</text>
  </g>

  <!-- ================= API GATEWAY ================= -->
  <g filter="url(#card-shadow)">
    <rect x="205" y="172" width="140" height="72" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.6" />
    <text x="275" y="203" fill="#92400E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">api-gateway</text>
    <text x="275" y="221" fill="#B45309" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" text-anchor="middle">REST + WS Edge</text>
  </g>

  <!-- ================= CORE SERVICES GROUP BOX ================= -->
  <rect x="392" y="52" width="186" height="248" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 3" />
  <text x="485" y="67" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="600" text-anchor="middle">GO MICROSERVICES (OTel)</text>

  <!-- trip-service -->
  <g filter="url(#card-shadow)">
    <rect x="405" y="76" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <rect x="405" y="76" width="4" height="56" rx="2" fill="#3B82F6" />
    <text x="488" y="100" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle">trip-service</text>
    <text x="488" y="117" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" text-anchor="middle">OSRM · fare · state</text>
  </g>

  <!-- driver-service -->
  <g filter="url(#card-shadow)">
    <rect x="405" y="152" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <rect x="405" y="152" width="4" height="56" rx="2" fill="#3B82F6" />
    <text x="488" y="176" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle">driver-service</text>
    <text x="488" y="193" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" text-anchor="middle">geohash matching</text>
  </g>

  <!-- payment-service -->
  <g filter="url(#card-shadow)">
    <rect x="405" y="228" width="160" height="56" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <rect x="405" y="228" width="4" height="56" rx="2" fill="#3B82F6" />
    <text x="488" y="252" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle">payment-service</text>
    <text x="488" y="269" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" text-anchor="middle">Stripe checkout</text>
  </g>

  <!-- redis (outside the Go microservices OTel box) -->
  <g filter="url(#card-shadow)">
    <rect x="405" y="324" width="160" height="58" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2" />
    <rect x="405" y="324" width="4" height="58" rx="2" fill="#EF4444" />
    <text x="488" y="349" fill="#7F1D1D" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle">redis</text>
    <text x="488" y="366" fill="#991B1B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" text-anchor="middle">WS session registry</text>
  </g>

  <!-- ================= ASYNC & TELEMETRY ================= -->
  <!-- rabbitmq -->
  <g filter="url(#card-shadow)">
    <rect x="635" y="134" width="185" height="92" rx="6" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.6" />
    <text x="727" y="165" fill="#115E59" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700" text-anchor="middle">rabbitmq</text>
    <text x="727" y="184" fill="#0F766E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" text-anchor="middle">topic exchange</text>
    <text x="727" y="200" fill="#0F766E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" text-anchor="middle">trip.* · driver.* · pay.*</text>
  </g>

  <!-- jaeger + prometheus -->
  <g filter="url(#card-shadow)">
    <rect x="635" y="302" width="185" height="68" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="727" y="331" fill="#0F172A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" text-anchor="middle">jaeger · prometheus</text>
    <text x="727" y="349" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" text-anchor="middle">tracing + metrics</text>
  </g>

  <!-- ================= ORTHOGONAL ROUTING LINES ================= -->
  <!-- Clients -> Gateway (Amber) -->
  <path d="M155,132 L180,132 L180,196 L203,196" fill="none" stroke="#D97706" stroke-width="1.4" marker-end="url(#arrow-amber)" />
  <path d="M155,282 L180,282 L180,220 L203,220" fill="none" stroke="#D97706" stroke-width="1.4" marker-end="url(#arrow-amber)" />

  <!-- Gateway -> Core Services & Redis (Slate gRPC) -->
  <path d="M345,192 L370,192 L370,104 L403,104" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow-slate)" />
  <path d="M345,202 L370,202 L370,180 L403,180" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow-slate)" />
  <path d="M345,214 L370,214 L370,256 L403,256" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow-slate)" />
  <path d="M345,224 L370,224 L370,353 L403,353" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow-slate)" />

  <!-- Core Services -> RabbitMQ (Teal Async Pub/Sub) -->
  <path d="M565,104 L600,104 L600,160 L633,160" fill="none" stroke="#0D9488" stroke-width="1.4" marker-end="url(#arrow-teal)" />
  <path d="M565,180 L633,180" fill="none" stroke="#0D9488" stroke-width="1.4" marker-end="url(#arrow-teal)" />
  <path d="M565,256 L600,256 L600,200 L633,200" fill="none" stroke="#0D9488" stroke-width="1.4" marker-end="url(#arrow-teal)" />

  <!-- Telemetry dashed links from api-gateway & Go Microservices group -> Jaeger/Prometheus -->
  <path d="M275,244 L275,392 L727,392 L727,372" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-slate)" />
  <path d="M578,284 L612,284 L612,336 L633,336" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-slate)" />

  <!-- ================= BOTTOM LEGEND BAR ================= -->
  <rect x="25" y="420" width="810" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />

  <line x1="45" y1="436" x2="68" y2="436" stroke="#D97706" stroke-width="1.8" />
  <text x="76" y="440" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">REST / WebSocket Edge</text>

  <line x1="255" y1="436" x2="278" y2="436" stroke="#64748B" stroke-width="1.8" />
  <text x="286" y="440" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">Internal gRPC</text>

  <line x1="460" y1="436" x2="483" y2="436" stroke="#0D9488" stroke-width="1.8" />
  <text x="491" y="440" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">Async RabbitMQ Pub/Sub</text>

  <line x1="680" y1="436" x2="703" y2="436" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="711" y="440" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">OTel / Scrape</text>
</svg>